<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrigado pela sua compra!</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #111827; /* bg-slate-900 */
            color: #e2e8f0; /* text-slate-200 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            background-color: #1e293b; /* bg-slate-800 */
            border-radius: 12px;
            border: 2px solid #0ea5e9; /* border-sky-500 */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #38bdf8; /* text-sky-400 */
            font-size: 2.25rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.125rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .footer-text {
            font-size: 0.875rem;
            color: #94a3b8; /* text-slate-400 */
        }
        a {
            color: #38bdf8;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Obrigado pela sua compra!</h1>
        <p>
            Recebemos o seu pedido com sucesso. Em breve, você receberá uma confirmação no seu e-mail e seu acesso será liberado.
        </p>
        <p class="footer-text">
            Você já pode fechar esta página. Se precisar, <a href="/">volte para a página inicial</a>.
        </p>
    </div>
</body>
</html>
